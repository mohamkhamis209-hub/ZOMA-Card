<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOMA — إنشاء حساب</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-box">
    <h1>🟢 ZOMA</h1>
    <p class="subtitle">إنشاء حساب جديد</p>

    <div class="form-group">
      <label>الاسم الكامل</label>
      <input type="text" id="fullName" placeholder="محمد أحمد" />
    </div>

    <div class="form-group">
      <label>رقم الهاتف</label>
      <input type="tel" id="phone" placeholder="201234567890" />
    </div>

    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="******" />
    </div>

    <button class="btn btn-primary btn-block" id="signupBtn">إنشاء حساب</button>

    <p class="auth-switch">
      عندك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </p>
    <p class="auth-switch" style="margin-top:8px">
      <a href="index.html">← العودة للرئيسية</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById("signupBtn").onclick = () => {
      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      signup(fullName, phone, password);
    };
  </script>

</body>
</html>
