<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOMA — تسجيل الدخول</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-box">
    <h1>🟢 ZOMA</h1>
    <p class="subtitle">تسجيل الدخول</p>

    <div class="form-group">
      <label>رقم الهاتف أو رقم البطاقة</label>
      <input type="text" id="identifier" placeholder="201234567890 أو ZOMA-XXXXXX" />
    </div>

    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="******" />
    </div>

    <button class="btn btn-primary btn-block" id="loginBtn">تسجيل الدخول</button>

    <p class="auth-switch">
      معندكش حساب؟ <a href="signup.html">أنشئ حساب</a>
    </p>
    <p class="auth-switch" style="margin-top:8px">
      <a href="index.html">← العودة للرئيسية</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById("loginBtn").onclick = () => {
      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;
      login(identifier, password);
    };

    // Enter يسجل دخول
    document.querySelectorAll("input").forEach(inp => {
      inp.addEventListener("keypress", (e) => {
        if (e.key === "Enter") document.getElementById("loginBtn").click();
      });
    });
  </script>

</body>
</html>
