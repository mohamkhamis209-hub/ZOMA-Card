<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZOMA — لوحة التحكم</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="logo">ZOMA <span>Smart Card</span></div>
    <div class="nav-buttons">
      <button class="btn btn-outline" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h1>👋 أهلًا <span id="userName">...</span></h1>
      <p class="subtitle">مرحبًا بك في لوحة تحكم ZOMA</p>
    </div>

    <div class="card">
      <h2>📊 حالة الحساب</h2>
      <p class="mt-2">📱 الهاتف: <b id="userPhone">-</b></p>
      <p>🎭 الدور: <b id="userRole">-</b></p>
    </div>

    <div class="card">
      <h2>🚧 الخطوات القادمة</h2>
      <p class="mt-2">هنا هتلاقي لاحقًا:</p>
      <p>💳 بطاقتي</p>
      <p>✏️ تعديل الملف</p>
      <p>🔐 الخصوصية</p>
      <p>📦 طلباتي</p>
      <p>🔔 الإشعارات</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;

      const profile = await getProfile();
      if (profile) {
        document.getElementById("userName").textContent = profile.full_name;
        document.getElementById("userPhone").textContent = profile.phone;
        document.getElementById("userRole").textContent =
          profile.role === "admin" ? "أدمن" : "عميل";
      }
    })();
  </script>

</body>
</html>
